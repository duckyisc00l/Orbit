name: Build Orbit

on:
  push:
    branches: [orbit]
  workflow_dispatch:

concurrency:
  group: orbit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"

      - name: Build
        run: python3 scripts/ci/workflow.py build

      - name: Rename IPA
        run: mv SideStore.ipa Orbit.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-ipa
          path: Orbit.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/logs
